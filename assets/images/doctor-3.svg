<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EAF6F8" />
      <stop offset="50%" stop-color="#F5FAFC" />
      <stop offset="100%" stop-color="#E1F2FB" />
    </linearGradient>
    <linearGradient id="poloGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0878BE" />
      <stop offset="100%" stop-color="#065C94" />
    </linearGradient>
    <linearGradient id="skinGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6D4BD" />
      <stop offset="100%" stop-color="#EABF9E" />
    </linearGradient>
    <filter id="shadow3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#163B4D" flood-opacity="0.1" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="450" rx="24" fill="url(#bgGrad3)" />
  <circle cx="320" cy="90" r="95" fill="#4FAF45" opacity="0.08" />
  <circle cx="70" cy="370" r="105" fill="#0878BE" opacity="0.08" />

  <!-- Doctor Silhouette & Body (Athletic Physical Therapist Uniform) -->
  <g filter="url(#shadow3)">
    <!-- Shoulders -->
    <path d="M 80 450 C 90 335, 130 310, 200 310 C 270 310, 310 335, 320 450 Z" fill="url(#poloGrad)" />
    <!-- Collar Left -->
    <path d="M 160 310 L 180 345 L 200 320 Z" fill="#065C94" />
    <!-- Collar Right -->
    <path d="M 240 310 L 220 345 L 200 320 Z" fill="#065C94" />
    <!-- Center Placket -->
    <path d="M 195 320 L 205 320 L 205 375 L 195 375 Z" fill="#054A78" />
  </g>

  <!-- Neck -->
  <path d="M 175 245 L 175 320 C 185 328, 215 328, 225 320 L 225 245 Z" fill="url(#skinGrad3)" />

  <!-- Head / Face -->
  <ellipse cx="200" cy="205" rx="55" ry="66" fill="url(#skinGrad3)" filter="url(#shadow3)" />

  <!-- Short Professional Hair & Grooming -->
  <path d="M 145 195 C 142 135, 160 115, 200 115 C 240 115, 258 135, 255 195 C 248 150, 235 135, 200 135 C 165 135, 152 150, 145 195 Z" fill="#4A3B32" />

  <!-- Eyes & Eyebrows -->
  <path d="M 168 180 Q 180 174 192 180" fill="none" stroke="#4A3B32" stroke-width="3" stroke-linecap="round" />
  <path d="M 208 180 Q 220 174 232 180" fill="none" stroke="#4A3B32" stroke-width="3" stroke-linecap="round" />
  <circle cx="180" cy="194" r="4.5" fill="#163B4D" />
  <circle cx="220" cy="194" r="4.5" fill="#163B4D" />
  <circle cx="182" cy="192" r="1.5" fill="#FFFFFF" />
  <circle cx="222" cy="192" r="1.5" fill="#FFFFFF" />

  <!-- Nose -->
  <path d="M 200 194 L 196 218 L 204 218" fill="none" stroke="#CD9B78" stroke-width="2.5" stroke-linecap="round" />

  <!-- Smile -->
  <path d="M 183 240 Q 200 256 217 240" fill="none" stroke="#A75B46" stroke-width="3.2" stroke-linecap="round" />

  <!-- Embroidered Center Logo Patch on Chest -->
  <circle cx="145" cy="365" r="12" fill="#FFFFFF" opacity="0.9" />
  <circle cx="145" cy="365" r="7" fill="#4FAF45" />
</svg>
